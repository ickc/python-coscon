name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # legacy and py39 include toast 2, which is only available on x86_64
        environment: [legacy, py39, py310, py311, py312, py313, py314]
        include:
          - os: macos-latest
            environment: py314
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          environments: ${{ matrix.environment }}
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
      # external data downloaded by astropy, e.g. from the Planck Legacy Archive and NERSC, which can time out
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.astropy/cache
          key: astropy-cache-${{ runner.os }}-${{ hashFiles('src/coscon/cmb.py') }}
          restore-keys: astropy-cache-${{ runner.os }}-
      - run: pixi run -e ${{ matrix.environment }} test
      - if: matrix.environment == 'legacy'
        run: pixi run -e legacy test-mpi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          environments: lint
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
      - run: pixi run -e lint lint

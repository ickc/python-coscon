[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[project]
name = "coscon"
version = "0.1.1"
description = "Some convenience functions for Cosmology-related analysis."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kolen Cheung", email = "christian.kolen@gmail.com" }]
keywords = ["cosmology", "CMB"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
# Python 3.8 is kept for research projects that depend on toast 2
requires-python = ">=3.8"
# lower bounds are kept from v0.1.1 so that older environments can still upgrade
dependencies = [
    "astropy>=4",
    "defopt>=6",
    "h5py>=3",
    "healpy>=1",
    "matplotlib>=3",
    "numba>=0.52",
    # numba-quaternion>=0.3 requires Python>=3.10, and older versions do not support numba>=0.59
    "numba<0.59; python_version < '3.10'",
    "numba-quaternion>=0.2",
    "numpy>=1",
    "pandas>=1",
    "plotly>=4",
    "pysm3>=3",
    "pyyaml>=5",
    "schema>=0.7",
    "scipy>=1",
    "seaborn>=0.11",
    "tabulate>=0.8",
    "toml>=0.10",
    "yamlloader>=0.5",
    # coscon.toast_helper and coscon.toast_extras need toast 2, which only has wheels for Python<=3.9 on x86_64.
    # toast 3 has an incompatible API. toast-cmb>=2.3.14 is an alias of toast.
    "toast-cmb>=2,<3; python_version < '3.10'",
]

[project.optional-dependencies]
extras = [
    "coloredlogs>=14",
]
mpi = [
    "mpi4py>=3",
]

[project.scripts]
fits_info = "coscon.fits_helper:fits_info_cli"
simmap_planck2018 = "coscon.cmb:simmap_planck2018_cli"

[project.urls]
Homepage = "https://github.com/ickc/python-coscon"
Documentation = "https://ickc.github.io/python-coscon"
Repository = "https://github.com/ickc/python-coscon"
Changelog = "https://github.com/ickc/python-coscon/blob/master/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-xdist>=3",
]
lint = [
    "ruff>=0.6",
]
# sphinx>=8.2 requires Python>=3.11
docs = [
    "sphinx>=8.2; python_version >= '3.11'",
    "furo>=2024.8.6; python_version >= '3.11'",
    "myst-parser>=4; python_version >= '3.11'",
]

[tool.uv]
default-groups = ["test"]

[tool.uv.build-backend]
source-include = ["tests/**"]

[tool.coverage.paths]
source = [
    "src",
    "*/site-packages",
]

[tool.coverage.run]
branch = true
source = ["coscon"]
parallel = true
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
src = ["src", "tests"]
target-version = "py38"

[tool.ruff.lint]
# pycodestyle errors and pyflakes only, as the codebase is in maintenance mode
select = ["E4", "E7", "E9", "F"]
ignore = [
    # l is the multipole moment
    "E741",
    # dtype strings in annotations such as np.ndarray['S']
    "F821",
]

# pixi: development and CI environments ########################################

[tool.pixi.workspace]
channels = ["conda-forge"]
# healpy does not support Windows
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.8"
astropy = ">=4"
defopt = ">=6"
h5py = ">=3"
healpy = ">=1"
matplotlib-base = ">=3"
numba = ">=0.52"
numpy = ">=1"
pandas = ">=1"
plotly = ">=4"
pysm3 = ">=3"
pyyaml = ">=5"
schema = ">=0.7"
scipy = ">=1"
seaborn-base = ">=0.11"
tabulate = ">=0.8"
toml = ">=0.10"
yamlloader = ">=0.5"

# numba-quaternion comes from PyPI as conda-forge only has 0.2.0 which does not support numba>=0.59
[tool.pixi.pypi-dependencies]
coscon = { path = ".", editable = true }

# the features test, lint and docs come from [dependency-groups]

[tool.pixi.feature.test.tasks]
test = "pytest -n auto --dist loadgroup --cov --cov-report=term --cov-report=xml"

[tool.pixi.feature.lint.dependencies]
python = ">=3.10"

[tool.pixi.feature.lint.tasks]
lint = "ruff check ."

[tool.pixi.feature.docs.dependencies]
python = ">=3.11"
# defopt pulls docutils from conda-forge, which must satisfy sphinx
docutils = "<0.22"

[tool.pixi.feature.docs.tasks]
docs = "sphinx-build -W -b dirhtml docs dist/docs"

[tool.pixi.feature.build.dependencies]
uv = "*"

[tool.pixi.feature.build.tasks]
build = "uv build"

# oldest supported Python, with toast 2 and MPI
# toast 2 comes from PyPI via toast-cmb in [project.dependencies], as pixi does not map conda-forge's toast to it.
# toast 2 wheels are only available for x86_64
[tool.pixi.feature.legacy]
platforms = ["linux-64"]

[tool.pixi.feature.legacy.dependencies]
python = "3.8.*"
mpi4py = ">=3"
# conda-forge's noarch defopt misses this dependency on Python 3.8
pkgutil-resolve-name = "*"
openmpi = "*"

# tests are MPI-aware via toast.mpi.get_world
[tool.pixi.feature.legacy.tasks]
test-mpi = "mpirun -n 2 --oversubscribe python -m pytest -p no:cacheprovider"

# with toast 2 as in legacy
[tool.pixi.feature.py39]
platforms = ["linux-64"]

[tool.pixi.feature.py39.dependencies]
python = "3.9.*"
# keep in sync with [project.dependencies]
numba = "<0.59"

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
default = ["test", "lint"]
legacy = ["legacy", "test"]
py39 = ["py39", "test"]
py310 = ["py310", "test"]
py311 = ["py311", "test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
docs = ["docs"]
lint = { features = ["lint"], no-default-feature = true }
build = { features = ["build"], no-default-feature = true }
